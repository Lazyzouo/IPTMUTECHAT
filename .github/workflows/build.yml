name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --console=plain

      - name: Verify localized artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n "s/^version = '\([^']*\)'/\1/p" build.gradle)"
          zh_jar="build/libs/IPTMUTECHAT-${version}-zh.cn.jar"
          en_jar="build/libs/IPTMUTECHAT-${version}-en.us.jar"
          test -f "$zh_jar"
          test -f "$en_jar"
          for jar in "$zh_jar" "$en_jar"; do
            unzip -p "$jar" plugin.yml | grep -F "version: '${version}'"
            unzip -p "$jar" plugin.yml | grep -F "authors: [Lazyz]"
            unzip -l "$jar" | grep -F "languages/en_US.yml"
          done
          unzip -p "$zh_jar" config.yml | grep -Fx "language: zh_CN"
          unzip -p "$en_jar" config.yml | grep -Fx "language: en_US"
          python3 tools/localize_jar.py --verify "$zh_jar" "$en_jar"

      - name: Upload localized JARs
        uses: actions/upload-artifact@v4
        with:
          name: IPTMUTECHAT-localized-jars
          path: |
            build/libs/IPTMUTECHAT-*-en.us.jar
            build/libs/IPTMUTECHAT-*-zh.cn.jar
          if-no-files-found: error
          retention-days: 14
