name: Release

on:
  push:
    branches: [main]
    paths:
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "src/**"
      - "presets/**"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Lazyzouo/IPTMUTECHAT'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n "s/^version = '\([^']*\)'/\1/p" build.gradle)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether Release exists
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Release
        if: steps.existing.outputs.exists == 'false'
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --console=plain

      - name: Prepare and verify Release assets
        if: steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release
          zh_jar="build/libs/IPTMUTECHAT-${VERSION}-zh.cn.jar"
          en_jar="build/libs/IPTMUTECHAT-${VERSION}-en.us.jar"
          test -f "$zh_jar"
          test -f "$en_jar"
          for jar in "$zh_jar" "$en_jar"; do
            unzip -p "$jar" plugin.yml | grep -F "version: '${VERSION}'"
            unzip -p "$jar" plugin.yml | grep -F "authors: [Lazyz]"
            unzip -l "$jar" | grep -F "languages/en_US.yml"
          done
          unzip -p "$zh_jar" config.yml | grep -Fx "language: zh_CN"
          unzip -p "$en_jar" config.yml | grep -Fx "language: en_US"
          python3 tools/localize_jar.py --verify "$zh_jar" "$en_jar"
          cat > build/release/RELEASE_NOTES.md <<EOF
          ## Official Release

          This Release was built automatically from the tagged source. Only two custom download assets are published:

          - \`IPTMUTECHAT-${VERSION}-en.us.jar\`: English is the official default language.
          - \`IPTMUTECHAT-${VERSION}-zh.cn.jar\`: Simplified Chinese is the official default language.

          Both packages contain the same plugin code, resources, and configuration comments. Only the official default \`language\` parameter differs. GitHub records a SHA-256 digest for each asset.

          **Compatibility:** Paper/Folia 1.20.1-1.21.11 · **Tested:** 1.21.11 · **Java bytecode:** 17 · **Author:** Lazyz

          ## 官方发布

          本 Release 由对应标签源码自动构建，只提供两个自定义下载资源：

          - \`IPTMUTECHAT-${VERSION}-en.us.jar\`：官方默认语言为英文。
          - \`IPTMUTECHAT-${VERSION}-zh.cn.jar\`：官方默认语言为简体中文。

          两个包包含完全相同的插件源码产物、资源与配置注释，仅官方默认 \`language\` 参数不同。GitHub 会为每个资源记录 SHA-256 摘要。

          **兼容：** Paper/Folia 1.20.1-1.21.11 · **测试版本：** 1.21.11 · **Java 字节码：** 17 · **作者：** Lazyz
          EOF

          changelog_section="$(awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { capture=1; next }
            capture && $0 ~ /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md)"
          test -n "$changelog_section"
          {
            echo
            echo "## Release Changelog / 版本更新日志"
            echo
            printf '%s\n' "$changelog_section"
          } >> build/release/RELEASE_NOTES.md

      - name: Create tag and GitHub Release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "IPTMUTECHAT $TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            "build/libs/IPTMUTECHAT-${VERSION}-en.us.jar" \
            "build/libs/IPTMUTECHAT-${VERSION}-zh.cn.jar" \
            --title "IPTMUTECHAT $TAG" \
            --notes-file build/release/RELEASE_NOTES.md \
            --generate-notes \
            --verify-tag

      - name: Enforce immutable Release asset filenames
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            "IPTMUTECHAT-${VERSION}-en.us.jar" \
            "IPTMUTECHAT-${VERSION}-zh.cn.jar" | sort)"
          actual="$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Release assets must contain exactly the two immutable localized filenames." >&2
            echo "Expected:" >&2
            echo "$expected" >&2
            echo "Actual:" >&2
            echo "$actual" >&2
            exit 1
          fi
