name: Bug report / 错误报告
description: Report reproducible plugin behavior / 报告可复现的插件问题
title: "[Bug] "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: "Use English first when possible. Do not post IP records or personal data. / 尽量先使用英文，严禁提交 IP 或个人数据。"
  - type: input
    id: version
    attributes:
      label: Plugin version / 插件版本
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server and Java / 服务端与 Java
      placeholder: "Paper 1.21.11 build ..., Java 21"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction / 复现步骤
      description: Provide minimal, numbered steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs / 实际行为与脱敏日志
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist / 检查
      options:
        - label: I tested the latest official Release. / 我已测试最新官方 Release。
          required: true
        - label: I removed IPs, credentials, and personal data. / 我已移除 IP、凭据与个人数据。
          required: true
